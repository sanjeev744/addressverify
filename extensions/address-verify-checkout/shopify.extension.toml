api_version = "2025-07"

[[extensions]]
uid = "address-verify-checkout"
type = "ui_extension"
name = "AddressVerify"
handle = "address-verify-checkout"

  [extensions.capabilities]
  api_access = true
  network_access = true

  [[extensions.targeting]]
  module = "./src/CheckoutDelivery.jsx"
  target = "purchase.checkout.delivery-address.render-after"

  [[extensions.targeting]]
  module = "./src/CheckoutBlock.jsx"
  target = "purchase.checkout.block.render"

  [[extensions.targeting]]
  module = "./src/ThankYou.jsx"
  target = "purchase.thank-you.block.render"

  [[extensions.targeting]]
  module = "./src/ThankYouCustomerInfo.jsx"
  target = "purchase.thank-you.customer-information.render-after"

  [[extensions.targeting]]
  module = "./src/OrderStatus.jsx"
  target = "customer-account.order-status.block.render"

  [[extensions.metafields]]
  namespace = "$app:addressverify"
  key = "config"
